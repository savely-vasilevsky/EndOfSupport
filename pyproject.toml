[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "end-of-support-tool"
version = "0.1.0"
description = "AWS resource support status analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]

[project.scripts]
eos-tool = "src.main:main"
eos-tool-gui = "src.gui:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"src.templates" = ["*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hypothesis]
max_examples = 100
