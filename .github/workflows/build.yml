name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pywin32

      - name: Build Windows executable
        run: python -m PyInstaller EndOfSupportTool.spec --clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndOfSupportTool-Windows
          path: dist/EndOfSupportTool.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build macOS app
        run: python -m PyInstaller EndOfSupportTool_mac.spec --clean

      - name: Zip macOS app
        run: |
          cd dist
          zip -r EndOfSupportTool-macOS.zip EndOfSupportTool.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndOfSupportTool-macOS
          path: dist/EndOfSupportTool-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EndOfSupportTool-Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: EndOfSupportTool-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            EndOfSupportTool.exe
            EndOfSupportTool-macOS.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
